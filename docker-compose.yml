
services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  localai:
    image: quay.io/go-skynet/local-ai:latest-gpu-nvidia-cuda-12
    # первый запуск потянет зависимости, можно залочить версию
    environment:
      - MODELS_PATH=/models
      - DEBUG=true
      - BUILD_GRPC=true
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all # Пробрасываем все доступные GPU
              capabilities: [gpu]
